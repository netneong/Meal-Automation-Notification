name: Daily Meal Schedule

on:
  schedule:
    # 최근 실행 기록 기준 깃허브 지연이 약 3~5.7시간이라 늦어도 오전 11시 안에 도착하도록 설정
    # KST 오전 04:47 -> UTC 전날 19:47
    # 피크 타임인 00분/30분을 피해서 지연을 최소화
    - cron: '47 19 * * *'
  workflow_dispatch: # 수동 실행 버튼 유지

jobs:
  send-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pytz

      - name: Run Scraper
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }} 
        run: |
          python scripts/main.py daily $WEBHOOK_URL